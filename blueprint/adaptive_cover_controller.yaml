###############################################################################
#
# Adaptive Cover Controller
#
# Version          : 2.1.0
# Author           : Waleed Gumaa
# Home Assistant   : 2025.7+
#
# Description
# ===========
#
# Automatically protects curtains, blinds and shutters from direct sunlight
# using the sun's position.
#
# Optional weather, cloud cover, occupancy and schedule validation modules
# are available.
#
# Create one automation per cover.
#
# Features
# ========
#
# - Sun azimuth and elevation protection.
# - Optional weather validation.
# - Optional cloud cover validation with hysteresis.
# - Optional occupancy validation.
# - Night lock and scheduled morning opening.
# - Manual override state machine.
# - Automatic/manual movement detection.
# - Prevent repeated movement commands while the cover is moving.
# - Automatic recovery after Home Assistant restart.
# - Periodic recovery to protect against missed events.
#
# Changelog
# =========
#
# 2.1.0
# - Covers with tilt now stay down for the whole sun window once closed;
#   cloud cover no longer forces a full raise while the sun is still in
#   range (only the sun leaving the azimuth/elevation window does).
# - Adaptive tilt toggle now only controls the tilt angle (fixed vs.
#   reacting to live cloud cover) and no longer affects position logic.
# - Covers without tilt are unaffected and keep the original two-way
#   cloud hysteresis (close, and re-open early if it gets too cloudy).
# - Manual override detection now also considers tilt mismatches, not
#   just position.
# - Automation no longer misreads a Home Assistant restart / integration
#   reload as a manual move.
# - Removed unused/dead calculated variable.
#
# 2.0.0
# - Initial public release.
#
###############################################################################

blueprint:
  name: Adaptive Cover Controller
  description: >
    Automatically protects curtains, blinds and shutters from direct sunlight
    using the sun's position.

    Optional weather, cloud cover, occupancy and schedule validation modules
    are available.

    Create one automation per cover.

  domain: automation
  author: Waleed Gumaa

  homeassistant:
    min_version: 2025.7.0

  input:


    # COVER


    cover:
      name: Cover
      description: Select the curtain, blind or shutter.
      selector:
        entity:
          filter:
            - domain: cover

    # SUN PROTECTION


    sun_protection:
      name: Sun Protection
      icon: mdi:white-balance-sunny
      input:

        azimuth_start:
          name: Start azimuth
          description: Begin protecting the cover when the sun reaches this azimuth.
          default: 90
          selector:
            number:
              min: 0
              max: 360
              step: 1
              unit_of_measurement: "°"
              mode: slider

        azimuth_end:
          name: End azimuth
          description: Stop protecting the cover after this azimuth.
          default: 180
          selector:
            number:
              min: 0
              max: 360
              step: 1
              unit_of_measurement: "°"
              mode: slider

        minimum_elevation:
          name: Minimum elevation
          description: Ignore the sun below this elevation.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "°"
              mode: slider


  # POSITIONS

    positions:
      name: Positions
      icon: mdi:curtains

      input:

        protection_position:
          name: Sun protection position
          description: Position used while protecting the room from sunlight.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        normal_position:
          name: Normal position
          description: Position used when protection is no longer required.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        auto_return:
          name: Automatically return
          description: Return to the normal position when protection is no longer required.
          default: true
          selector:
            boolean: {}

  # SCHEDULE

    schedule:
      name: Schedule
      icon: mdi:clock-outline

      input:

        night_lock:
          name: Night lock
          description: Prevent automatic opening after this time.
          default: "22:00:00"
          selector:
            time: {}

        weekday_open:
          name: Weekday opening time
          default: "07:00:00"
          selector:
            time: {}

        weekend_open:
          name: Weekend opening time
          default: "09:00:00"
          selector:
            time: {}

        weekdays:
          name: Weekdays
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun

        weekends:
          name: Weekends
          default:
            - sat
            - sun
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun

  # MANUAL OVERRIDE

    manual_override:
      name: Manual Override
      icon: mdi:hand-back-right

      input:

        enable_manual_override:
          name: Enable manual override
          description: >
            Ignore automatic movement after a manual position change until the
            controller regains control.
          default: false
          selector:
            boolean: {}

        controller_state_helper:
          name: Controller state helper
          description: >
            Required only when Manual Override is enabled.

            Create one Input Select helper per cover with the
            following options:

            - normal
            - automation
            - manual

          default: {}
          selector:
            entity:
              filter:
                - domain: input_select

        manual_override_timeout:
          name: Manual override timeout (minutes)
          description: >
            Automatically hand control back to the automation after this
            long in manual mode, regardless of position. Set to 0 to
            disable — manual mode will then only clear once the cover's
            position/tilt happens to match what the automation wants.
          default: 120
          selector:
            number:
              min: 0
              max: 360
              step: 30
              unit_of_measurement: minutes
              mode: slider

  # OCCUPANCY

    occupancy:
      name: Occupancy (Optional)
      icon: mdi:account-group
      collapsed: true

      input:

        use_occupancy:
          name: Enable occupancy validation
          default: false
          selector:
            boolean: {}

        people:
          name: People
          description: >
            At least one selected person must be home before the cover is allowed
            to move.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person

  # WEATHER VALIDATION

    weather:
      name: Weather Validation (Optional)
      icon: mdi:weather-partly-cloudy
      collapsed: true

      input:

        use_weather:
          name: Enable weather validation
          default: false
          selector:
            boolean: {}

        weather_entity:
          name: Weather entity
          default: {}
          selector:
            entity:
              filter:
                - domain: weather

        allowed_conditions:
          name: Allowed weather conditions
          description: >
            Sun protection is only activated when the current weather matches one of these conditions.
          default:
            - sunny
            - partlycloudy
          selector:
            select:
              multiple: true
              options:
                - clear-night
                - cloudy
                - exceptional
                - fog
                - hail
                - lightning
                - lightning-rainy
                - partlycloudy
                - pouring
                - rainy
                - snowy
                - snowy-rainy
                - sunny
                - windy
                - windy-variant

  # CLOUD COVER

    cloud_cover:
      name: Cloud Cover (Optional)
      icon: mdi:weather-cloudy
      collapsed: true

      input:

        use_cloud_cover:
          name: Enable cloud cover validation
          default: false
          selector:
            boolean: {}

        cloud_cover_sensor:
          name: Cloud cover sensor
          description: >
            Select a sensor that reports cloud cover as a percentage (0–100).
          default: {}
          selector:
            entity:
              filter:
                - domain: sensor

        close_below:
          name: Close below
          description: >
            Protection becomes active when cloud cover is below this percentage.
          default: 40
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        open_above:
          name: Open above
          description: >
            Protection is removed when cloud cover rises above this percentage.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

  # BLIND FEATURES

    blind_features:
      name: Blind Features (Optional)
      icon: mdi:blinds-horizontal
      collapsed: true

      input:

        use_tilt:
          name: Enable tilt control
          default: false
          selector:
            boolean: {}

        protection_tilt:
          name: Protection tilt position
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        normal_tilt:
          name: Normal tilt position
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        adaptive_tilt:
          name: Adaptive tilt mode
          description: >
            While protecting, continuously adjust the tilt angle between
            Protection tilt and Adaptive tilt position based on the live
            cloud cover reading, instead of holding a fixed tilt angle.

            This only affects the tilt angle. The cover itself still stays
            down for the whole sun window either way.
          default: false
          selector:
            boolean: {}

        adaptive_tilt_position:
          name: Adaptive tilt position
          description: >
            The tilt angle used at the cloudiest end of the range (at or
            above Open above). Protection tilt is used at the sunniest end
            (at or below Close below), and the tilt is interpolated between
            the two as cloud cover changes. Only used when Adaptive tilt
            mode is enabled.
          default: 30
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

  # ADVANCED

    advanced:
      name: Advanced
      icon: mdi:cog
      collapsed: true

      input:

        recheck_interval:
          name: Recheck interval
          description: >
            Periodically re-evaluate the automation to recover from missed events
            or Home Assistant restarts.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider

# TRIGGER VARIABLES

trigger_variables:

  cfg_recheck_interval: !input recheck_interval

# TRIGGERS

trigger:

# HOME ASSISTANT

  - trigger: homeassistant
    event: start
    id: startup

# SUN

  - trigger: state
    entity_id: sun.sun
    attribute: azimuth
    id: sun_changed

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input minimum_elevation
    id: elevation_above

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input minimum_elevation
    id: elevation_below

# COVER

  - trigger: state
    entity_id: !input cover
    id: cover_changed
    not_from:
      - unavailable
      - unknown

# PRESENCE

  - trigger: state
    entity_id: !input people
    id: presence_changed

# WEATHER

  - trigger: state
    entity_id: !input weather_entity
    id: weather_changed

# CLOUD COVER

  - trigger: state
    entity_id: !input cloud_cover_sensor
    id: cloud_cover_changed

# PERIODIC RECOVERY

  - trigger: template
    value_template: >
      {{ now().minute % (cfg_recheck_interval | int(5)) == 0
         and now().second == 0 }}
    id: periodic

# VARIABLES

variables:

# CONFIGURATION

  cfg_cover: !input cover

  cfg_protection_position: !input protection_position
  cfg_normal_position: !input normal_position
  cfg_auto_return: !input auto_return

  cfg_use_weather: !input use_weather
  cfg_weather_entity: !input weather_entity
  cfg_allowed_conditions: !input allowed_conditions

  cfg_use_cloud_cover: !input use_cloud_cover
  cfg_cloud_sensor: !input cloud_cover_sensor
  cfg_close_below: !input close_below
  cfg_open_above: !input open_above

  cfg_use_occupancy: !input use_occupancy
  cfg_people: !input people

  cfg_use_tilt: !input use_tilt
  cfg_protection_tilt: !input protection_tilt
  cfg_normal_tilt: !input normal_tilt
  
  cfg_adaptive_tilt: !input adaptive_tilt
  cfg_adaptive_tilt_position: !input adaptive_tilt_position

# MANUAL OVERRIDE

  cfg_manual_override: !input enable_manual_override
  cfg_controller_state: !input controller_state_helper
  cfg_manual_override_timeout: !input manual_override_timeout

# SUN PROTECTION

  cfg_sun_start: !input azimuth_start
  cfg_sun_end: !input azimuth_end
  cfg_min_elevation: !input minimum_elevation

# SCHEDULE CONFIGURATION

  cfg_night_lock: !input night_lock

  cfg_weekday_open: !input weekday_open
  cfg_weekend_open: !input weekend_open

  cfg_weekdays: !input weekdays
  cfg_weekends: !input weekends

# CONTEXT

  ctx_cover_position: >
    {% set p = state_attr(cfg_cover, 'current_position') %}
    {% if p is not none %}
      {{ p | int }}
    {% else %}
      {{ state_attr(cfg_cover, 'position') | int(-1) }}
    {% endif %}

  ctx_cover_tilt: >
    {{ state_attr(cfg_cover, 'current_tilt_position') | int(-1) }}

  ctx_cover_state: >
    {{ states(cfg_cover) }}

# COVER STATUS

  calc_cover_idle: >
    {{ ctx_cover_state not in ['opening', 'closing'] }}

  calc_currently_protecting: >
    {{ (ctx_cover_position | int) == (cfg_protection_position | int) }}

  ctx_sun_azimuth: >
    {% if trigger is defined
          and trigger.to_state is not none
          and trigger.entity_id == 'sun.sun'
          and trigger.attribute == 'azimuth' %}
      {{ trigger.to_state.attributes.azimuth | float(0) }}
    {% else %}
      {{ state_attr('sun.sun', 'azimuth') | float(0) }}
    {% endif %}

  ctx_sun_elevation: >
    {{ state_attr('sun.sun', 'elevation') | float(-90) }}

  ctx_weather: >
    {% if cfg_use_weather %}
      {{ states(cfg_weather_entity) }}
    {% else %}
      disabled
    {% endif %}

  ctx_cloud_cover: >
    {% if cfg_use_cloud_cover %}
      {{ states(cfg_cloud_sensor) | float(100) }}
    {% else %}
      -1
    {% endif %}

# SUN VALIDATION

  calc_sun_in_window: >
    {% set start = cfg_sun_start | float %}
    {% set finish = cfg_sun_end | float %}
    {% set az = ctx_sun_azimuth | float %}

    {% if start <= finish %}
      {{ start <= az <= finish }}
    {% else %}
      {{ az >= start or az <= finish }}
    {% endif %}

  calc_sun_ok: >
    {{
      calc_sun_in_window
      and
      (ctx_sun_elevation|float >= cfg_min_elevation|float)
    }}

# VALIDATION MODULES

  calc_weather_ok: >
    {% if not cfg_use_weather %}
      {{ true }}
    {% else %}
      {{ ctx_weather in cfg_allowed_conditions }}
    {% endif %}

# ADAPTIVE TILT
#
# Where the live cloud reading falls between Close below and Open
# above, expressed as a 0-1 fraction (0 = sunniest, 1 = cloudiest).
# Used only when Adaptive tilt mode is enabled.

  calc_cloud_fraction: >
    {% set lo = cfg_close_below | float %}
    {% set hi = cfg_open_above | float %}
    {% if hi == lo %}
      0
    {% else %}
      {% set raw = ((ctx_cloud_cover | float) - lo) / (hi - lo) %}
      {{ min(max(raw, 0), 1) }}
    {% endif %}

  calc_adaptive_tilt_value: >
    {% set lo_tilt = cfg_protection_tilt | float %}
    {% set hi_tilt = cfg_adaptive_tilt_position | float %}
    {{ (lo_tilt + (calc_cloud_fraction | float) * (hi_tilt - lo_tilt)) | round(0) | int }}

# OCCUPANCY VALIDATION

  calc_someone_home: >
    {% if not cfg_use_occupancy %}
      {{ true }}
    {% else %}
      {{
        expand(cfg_people)
        | selectattr('state','eq','home')
        | list
        | count > 0
      }}
    {% endif %}

# GATE
#
# Whether this cover is a candidate for protection at all right now.
# Cloud cover deliberately isn't part of this — it only decides the
# protection LEVEL below, once the gate is open.

  calc_gate_ok: >
    {{
      calc_sun_ok
      and
      calc_weather_ok
      and
      calc_someone_home
    }}

# SCHEDULE

  calc_today: >
    {{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}

  calc_open_time: >
    {% if calc_today in cfg_weekdays %}
      {{ cfg_weekday_open }}
    {% elif calc_today in cfg_weekends %}
      {{ cfg_weekend_open }}
    {% else %}
      disabled
    {% endif %}

  calc_can_auto_open: >
    {% if calc_open_time == 'disabled' %}
      {{ false }}
    {% else %}
      {% set now_time = now() %}
      {% set night = today_at(cfg_night_lock) %}
      {% set open = today_at(calc_open_time) %}

      {{ not (now_time >= night or now_time < open) }}

    {% endif %}

# PROTECTION LEVEL
#
# NONE    = gate failed (sun out of window, weather, or occupancy) —
#           fully open.
# FULL    = gate passed and it's sunny enough (cloud <= Close below) —
#           protection position, protection tilt.
# PARTIAL = tilt-only covers, gate passed, cloud has risen above Close
#           below while the sun is still in the window. Position stays
#           down; tilt reacts (or holds Protection tilt, depending on
#           Adaptive tilt mode).
#
# Covers without tilt never produce PARTIAL — cloud cover fully gates
# them both ways, same as before (close below Close below, re-open
# above Open above).

  result_protection_level: >
    {% if not calc_gate_ok %}

      NONE

    {% elif not cfg_use_cloud_cover %}

      FULL

    {% elif cfg_use_tilt %}

      {% if calc_currently_protecting %}
        {% if (ctx_cloud_cover | float) <= (cfg_close_below | float) %}
          FULL
        {% else %}
          PARTIAL
        {% endif %}
      {% else %}
        {% if (ctx_cloud_cover | float) <= (cfg_close_below | float) %}
          FULL
        {% else %}
          NONE
        {% endif %}
      {% endif %}

    {% elif calc_currently_protecting %}

      {% if (ctx_cloud_cover | float) < (cfg_open_above | float) %}
        FULL
      {% else %}
        NONE
      {% endif %}

    {% else %}

      {% if (ctx_cloud_cover | float) <= (cfg_close_below | float) %}
        FULL
      {% else %}
        NONE
      {% endif %}

    {% endif %}

# CONTROLLER STATE

  calc_controller_manual: >
    {{ is_state(cfg_controller_state, 'manual') }}

  calc_controller_automatic: >
    {{ is_state(cfg_controller_state, 'automation') }}

  calc_controller_ready: >
    {{ is_state(cfg_controller_state, 'normal') }}

  calc_manual_override_expired: >
    {% if not cfg_manual_override or (cfg_manual_override_timeout | int(0)) <= 0 %}

      {{ false }}

    {% elif not calc_controller_manual %}

      {{ false }}

    {% else %}

      {% set since = as_timestamp(now()) - as_timestamp(states[cfg_controller_state].last_changed) %}
      {{ since >= (cfg_manual_override_timeout | int) * 60 }}

    {% endif %}

# MANUAL OVERRIDE

  restriction_manual_override: >
    {% if not cfg_manual_override %}
      {{ false }}
    {% elif calc_manual_override_expired %}
      {{ false }}
    {% else %}
      {{ calc_controller_manual }}
    {% endif %}

# MOVEMENT RESTRICTIONS

  calc_movement_allowed: >
    {{ not restriction_manual_override }}


# STATE ENGINE
#
# Determines what the controller wants to do.
#
# PROTECT   = Move to the protection position (level FULL or PARTIAL).
# RETURN    = Return to the normal position.
# OVERRIDDEN = User has taken manual control.
# IDLE      = No movement required.

  result_state: >
    {% if restriction_manual_override %}

      OVERRIDDEN

    {% elif result_protection_level != 'NONE' %}

      PROTECT

    {% elif cfg_auto_return and calc_can_auto_open %}

      RETURN

    {% else %}

      IDLE

    {% endif %}
  
# OUTPUTS

  result_desired_position: >
    {% if result_state == 'PROTECT' %}
      {{ cfg_protection_position }}
    {% elif result_state == 'RETURN' %}
      {{ cfg_normal_position }}
    {% else %}
      {{ ctx_cover_position }}
    {% endif %}
  result_desired_tilt: >
    {% if not cfg_use_tilt %}
      -1
    {% elif result_state == 'RETURN' %}
      {{ cfg_normal_tilt }}
    {% elif result_state == 'PROTECT' %}
      {% if result_protection_level == 'FULL' %}
        {{ cfg_protection_tilt }}
      {% elif cfg_adaptive_tilt %}
        {{ calc_adaptive_tilt_value }}
      {% else %}
        {{ cfg_protection_tilt }}
      {% endif %}
    {% else %}
      {{ ctx_cover_tilt }}
    {% endif %}

# MOVEMENT DECISION

  result_move_cover: >
    {{
      calc_movement_allowed
      and
      calc_cover_idle
      and
      (result_desired_position | int != ctx_cover_position | int)
    }}

  result_move_tilt: >
    {{
      cfg_use_tilt
      and
      calc_cover_idle
      and
      (result_desired_tilt | int != ctx_cover_tilt | int)
    }}

# STATE MATCH
#
# Whether the physical cover currently matches what the automation
# would want, IGNORING whether it's currently overridden. This has to
# be computed independently of result_desired_position/result_desired_tilt:
# those deliberately echo the current position/tilt while OVERRIDDEN
# (so nothing tries to move it), which makes them useless for deciding
# whether an override should clear — that comparison would always
# trivially "match" the moment you're in manual mode, clearing it on
# the very next cover event regardless of where the cover actually is.
#
# calc_would_be_state mirrors result_state's PROTECT/RETURN/IDLE logic
# but without the manual-override branch, so it reflects what the
# automation actually wants right now, override or not.

  calc_would_be_state: >
    {% if result_protection_level != 'NONE' %}
      PROTECT
    {% elif cfg_auto_return and calc_can_auto_open %}
      RETURN
    {% else %}
      IDLE
    {% endif %}

  calc_automatic_position: >
    {% if calc_would_be_state == 'PROTECT' %}
      {{ cfg_protection_position }}
    {% elif calc_would_be_state == 'RETURN' %}
      {{ cfg_normal_position }}
    {% else %}
      {{ ctx_cover_position }}
    {% endif %}

  calc_automatic_tilt: >
    {% if not cfg_use_tilt %}
      -1
    {% elif calc_would_be_state == 'RETURN' %}
      {{ cfg_normal_tilt }}
    {% elif calc_would_be_state == 'PROTECT' %}
      {% if result_protection_level == 'FULL' %}
        {{ cfg_protection_tilt }}
      {% elif cfg_adaptive_tilt %}
        {{ calc_adaptive_tilt_value }}
      {% else %}
        {{ cfg_protection_tilt }}
      {% endif %}
    {% else %}
      {{ ctx_cover_tilt }}
    {% endif %}

  calc_position_mismatch: >
    {{ calc_automatic_position | int != ctx_cover_position | int }}

  calc_tilt_mismatch: >
    {{ cfg_use_tilt and (calc_automatic_tilt | int != ctx_cover_tilt | int) }}

  calc_state_mismatch: >
    {{ calc_position_mismatch or calc_tilt_mismatch }}

# CONDITIONS

conditions: []

# ACTIONS

actions:

# MANUAL OVERRIDE EXPIRED
#
# Time-based, not event-based, so this deliberately runs on any trigger
# (the periodic recheck is what actually catches it). Doesn't stop —
# lets the rest of this run act on the now-current protection level.

  - if:
      - condition: template
        value_template: >
          {{ calc_manual_override_expired }}

    then:

      - action: input_select.select_option
        target:
          entity_id: !input controller_state_helper

        data:
          option: normal

# ACTIVATE MANUAL OVERRIDE

  - if:
      - condition: trigger
        id: cover_changed

      - condition: template
        value_template: >
          {{ cfg_manual_override }}

      - condition: template
        value_template: >
          {{ calc_controller_ready }}

      - condition: template
        value_template: >
          {{ calc_cover_idle }}

      - condition: template
        value_template: >
          {{ calc_state_mismatch }}

    then:

      - action: input_select.select_option
        target:
          entity_id: !input controller_state_helper

        data:
          option: manual

      - stop: Manual override activated.

# CLEAR MANUAL OVERRIDE
#
# These two don't move anything, they only reset the tracking helper —
# so unlike ACTIVATE above, they're safe to check on any trigger, not
# just cover_changed. Gating them to cover_changed only would leave the
# override stuck if the desired state happens to catch up to the
# physical position without the cover itself moving again (e.g. the sun
# leaves the window while the cover is parked at a position that now
# happens to match).

   # Automation movement completed

  - if:
      - condition: template
        value_template: >
          {{ calc_controller_automatic }}

      - condition: template
        value_template: >
          {{ calc_cover_idle }}

      - condition: template
        value_template: >
          {{ not calc_state_mismatch }}

    then:

      - action: input_select.select_option
        target:
          entity_id: !input controller_state_helper

        data:
          option: normal

      - stop: Automation movement completed.

  # Manual override cleared
  #
  # Deliberately gated to an actual cover_changed event, not any trigger:
  # for covers without tilt, the desired position only ever has a
  # couple of possible values, so an unrelated trigger (cloud, sun,
  # periodic) can coincidentally match wherever a manual position sits
  # without the person actually having resolved anything. The timeout
  # above handles the "never converges" case instead.

  - if:
      - condition: trigger
        id: cover_changed

      - condition: template
        value_template: >
          {{ calc_controller_manual }}

      - condition: template
        value_template: >
          {{ calc_cover_idle }}

      - condition: template
        value_template: >
          {{ not calc_state_mismatch }}

    then:

      - action: input_select.select_option
        target:
          entity_id: !input controller_state_helper

        data:
          option: normal

      - stop: Manual override cleared.

   # Ignore remaining cover state updates

  - if:
      - condition: trigger
        id: cover_changed

    then:
      - stop: Cover change processed.

# EXIT IF NO MOVEMENT IS REQUIRED

  - if:
      - condition: template
        value_template: >
          {{
            not result_move_cover
            and
            not result_move_tilt
          }}
    then:
      - stop: Cover already in desired state.

# MARK AS AUTOMATION
#
# Runs once for either a position move, a tilt move, or both, so tilt-only
# moves are tracked the same way as position moves.

  - if:
      - condition: template
        value_template: >
          {{
            cfg_manual_override
            and
            (result_move_cover or result_move_tilt)
          }}

    then:

      - action: input_select.select_option
        target:
          entity_id: !input controller_state_helper

        data:
          option: automation

# MOVE COVER

  - if:
      - condition: template
        value_template: >
          {{ result_move_cover }}

    then:

      - action: cover.set_cover_position
        target:
          entity_id: !input cover

        data:
          position: >
            {{ result_desired_position }}

# MOVE TILT

  - if:
      - condition: template
        value_template: >
          {{ result_move_tilt }}
    then:

      - action: cover.set_cover_tilt_position

        target:
          entity_id: !input cover

        data:
          tilt_position: >
            {{ result_desired_tilt }}

mode: single

max_exceeded: silent